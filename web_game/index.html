<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Dungeon Browser Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="menu-screen" id="menuScreen">
            <h1>Mystery Dungeon</h1>
            <div class="menu-content">
                <label for="floorCount">Number of Floors:</label>
                <input type="number" id="floorCount" min="1" max="20" value="5">
                <button id="startButton">Start Dungeon</button>
            </div>
        </div>
        
        <div class="game-screen" id="gameScreen" style="display: none;">
            <div class="game-header">
                <div class="floor-info">
                    Floor: <span id="currentFloor">1</span> / <span id="totalFloors">5</span>
                </div>
                <button id="resetButton">New Dungeon</button>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="controls">
                <p>Use WASD or Arrow Keys to move</p>
                <p>Hold multiple keys (e.g., W+A) for diagonal movement</p>
                <p>Find the red staircase to advance to the next floor</p>
            </div>
        </div>
    </div>
    
    <script src="game.js?v=2"></script>
</body>
</html>
